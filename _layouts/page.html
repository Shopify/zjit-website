<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="language" content="English" />
    <meta property="og:type" content="website" />
    <title>{{ page.title }}</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <!-- <link rel="alternate" type="application/rss+xml" title="Blog" href="{{ site.url }}/feed.xml" /> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="/assets/site.css">
  </head>
  <body>
    <header class="masthead">
      <div class="inner">
        <p class="site-name"><a href="/"><img src="/z-logo.svg" alt="{{ site.title }}" style="height: 1.5em; vertical-align: middle;"></a></p>
      </div>
      <nav class="navbar">
        <ul>
          <li><a href="https://github.com/ruby/ruby/tree/master/zjit">source</a></li>
          <li><a href="https://docs.ruby-lang.org/en/master/jit/zjit_md.html">docs</a></li>
        </ul>
      </nav>
    </header>
    <main class="inner">
      <h1>{{ page.title }}</h1>
      {{ content }}
    </main>
    <footer class="footer">
      <div class="inner">
        <p>ZJIT is part of <a href="https://www.ruby-lang.org/">Ruby</a>.</p>
      </div>
    </footer>
  </body>
</html>
